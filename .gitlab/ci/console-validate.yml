# Build/test only. No artifacts, Pages publishing or demo-data upload.
console_build:
  stage: validation
  script:
    - uv run --no-sync pytest -q frontend/tests
    - uv run --no-project --with tinycss2==1.4.0 python frontend/check_static.py
    - uv run --no-sync python frontend/build_console.py --output-dir dist/console
    - 'printf "PAGES_REVIEW_URL=%s\n" "$CI_PAGES_URL"'

console_javascript:
  stage: validation
  image: node:24-alpine
  before_script: []
  script:
    - node --version
    - node --check frontend/assets/console.js
    - node --test frontend/tests/live_copy.test.cjs
