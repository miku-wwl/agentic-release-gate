[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "releasegate"
version = "0.1.0"
description = "Commit-bound release evidence and deterministic DevSecOps policy"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = ["defusedxml==0.7.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "bandit==1.8.6", "ruff==0.13.3", "PyYAML==6.0.3"]

[project.scripts]
releasegate = "releasegate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/releasegate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
